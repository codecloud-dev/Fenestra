[package]
name = "fenestra-shell"
version = "0.2.0"
edition = "2021"
rust-version = "1.77.2"
description = "Fenestra Tauri 2 外壳：渲染引擎抽象为可替换接口层"
license = "LicenseRef-Fenestra-Open-1.0"
repository = "https://github.com/codecloud-dev/Fenestra"

# 独立 workspace：与根 Cargo workspace 的纯 Rust 闸门解耦，
# 让 gate 的 cargo test 不必依赖 webkit2gtk 等系统库。
[workspace]

[lib]
name = "fenestra_shell_lib"
path = "src/lib.rs"
# Tauri 2 移动端要求 lib 同时产出 cdylib（JNI 加载的 .so）、staticlib 与 rlib。
# rlib 供桌面 bin 链接；cdylib 供 Android 打包进 APK。
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "fenestra-shell"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# gate_check 走真正的 fenestra-gate（默认拒绝 / 声明 ∩ 策略 / 可审计裁决），
# 不再是「硬编码允许列表」占位。path 依赖跨 workspace 不影响根 workspace 的独立测试。
fenestra-gate = { path = "../../../crates/gate" }
