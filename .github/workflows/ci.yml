name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. 纯 Rust 权限闸门：零系统依赖，可独立测试与严格 lint。
  gate:
    name: gate · cargo test + clippy -D warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: 测试（默认拒绝 / 最小权限交集 / Untrusted 出站重校验 / 可逆登记）
        run: cargo test -p fenestra-gate
      - name: 严格静态检查
        run: cargo clippy -p fenestra-gate --all-targets -- -D warnings

  # 2. Cordis 4 插件运行时：类型检查 + 测试 + 示例插件类型检查。
  core:
    name: core · typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 类型检查
        run: pnpm --filter @fenestra/core typecheck
      - name: 单元测试（可逆 effect / 逆序卸载 / 热装不重启）
        run: pnpm --filter @fenestra/core test
      - name: 示例插件类型检查
        run: pnpm run plugins:typecheck

  # 3. Svelte 5 + Vite 8 前端壳构建。
  ui:
    name: ui · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 构建
        run: pnpm --filter @fenestra/ui build

  # 4. Tauri 2 外壳：装系统依赖后真编译（本地沙箱缺 webkit2gtk-4.1，故只在 CI 编译）。
  shell:
    name: shell · Tauri 2 编译
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # generate_context!() 在编译期就会读 frontendDist，UI 产物必须真实存在。
      # job 之间不共享文件系统，不能指望上面的 ui job 帮忙构建。
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 构建 UI 产物（frontendDist 指向 packages/ui/dist）
        run: pnpm --filter @fenestra/ui build
      - uses: dtolnay/rust-toolchain@stable
      - name: 安装 webkit2gtk-4.1 等系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl wget file
      - name: 真编译 Tauri 外壳
        run: cargo build --manifest-path apps/shell/src-tauri/Cargo.toml

  # 5. 双许可守门：两文件齐备、层 A 自撰且符合 OSD、已公开版本不闭源。
  license-guard:
    name: license-guard · 双许可守门
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验两份许可证 + 层 A 不闭源
        run: bash scripts/check-licenses.sh

  # 6. 文档：相对链接有效性 + 命名一致性 + 徽章阶段。
  docs:
    name: docs · 链接与命名
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 链接 / 命名 / 徽章检查
        run: python3 scripts/check-docs.py
