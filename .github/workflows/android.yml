name: Android APK

# 在 CI runner 上装 SDK、编译可安装的 APK；构建步骤固化以保证可复现。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/shell/**'
      - 'packages/ui/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/android.yml'
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: 真编 Android APK（arm64）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      # Rust 工具链 + 四个 Android 编译目标（runner 上 stable 版本与其 manifest 一致，
      # 不会像本地沙箱那样出现 rustc 与 channel manifest 对不上的问题）。
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 直接用 ubuntu runner 预装的 Android SDK：setup-android@v3 会去请求已废弃的
      # "tools" 包，导致 sdkmanager 失败。
      # runner 镜像自带 /usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager。
      - name: 注入预装 Android SDK 环境
        run: |
          SDK=/usr/local/lib/android/sdk
          test -x "$SDK/cmdline-tools/latest/bin/sdkmanager" || test -x "$SDK/cmdline-tools/16.0/bin/sdkmanager" || { echo "::error::runner 无 cmdline-tools"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: 安装 Android SDK / Build-Tools / NDK r27c
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973"
          SDK=/usr/local/lib/android/sdk
          echo "NDK_HOME=$SDK/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/27.0.12077973" >> "$GITHUB_ENV"

      # tauri.conf.json 的 frontendDist 指向 ../../../packages/ui/dist，必须先构建真实 UI。
      - name: 构建真实 UI 产物
        run: pnpm --filter @fenestra/ui build

      - name: 核对配置与已入库的 Android 工程
        run: |
          grep -q '"identifier": "dev.codecloud.fenestra"' apps/shell/src-tauri/tauri.conf.json
          grep -q '"frontendDist": "../../../packages/ui/dist"' apps/shell/src-tauri/tauri.conf.json
          test -f packages/ui/dist/index.html
          test -f apps/shell/src-tauri/gen/android/gradlew
          test -f apps/shell/src-tauri/gen/android/app/src/main/AndroidManifest.xml

      # gen/android 已入库；CLI 会在构建时重新生成 tauri.settings.gradle /
      # tauri.build.gradle.kts / tauri.properties（含 runner 本地路径），无需手动改。
      - name: 真编译 APK（debug，arm64-v8a）
        working-directory: apps/shell
        env:
          RUSTUP_TOOLCHAIN: stable
        run: pnpm exec tauri android build --apk --debug --target aarch64 --ci

      - name: 收集 APK 并计算 sha256
        run: |
          APK=$(find apps/shell/src-tauri/gen/android -name '*.apk' -type f | head -1)
          if [ -z "$APK" ]; then
            echo "::error::没有产出任何 APK"
            exit 1
          fi
          echo "原始产物：$APK"
          cp "$APK" fenestra.apk
          sha256sum fenestra.apk | tee fenestra.apk.sha256
          echo "size=$(stat -c %s fenestra.apk) bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: fenestra-android-apk
          path: |
            fenestra.apk
            fenestra.apk.sha256
          if-no-files-found: error

      # 语义化 tag 推送时，把同一份审查包上传到对应 Release。
      - name: 上传 APK 到版本 Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Fenestra $TAG" \
              --notes "审查包：debug 构建，arm64-v8a，附 sha256。" || exit 1
          fi
          for f in fenestra.apk fenestra.apk.sha256; do
            gh release delete-asset "$TAG" "$f" --yes 2>/dev/null || true
            gh release upload "$TAG" "$f" --clobber
          done
          gh release view "$TAG" --json assets --jq '.assets[] | {name, size, state}'
