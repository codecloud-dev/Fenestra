# Fenestra Cargo workspace（层 A）
# 纯 Rust 权限闸门在此 workspace 内；Tauri 外壳 src-tauri 是独立 workspace，
# 通过 exclude 隔离，避免 gate 的 cargo test 触碰 webkit2gtk 系统依赖。
[workspace]
resolver = "2"
members = ["crates/gate"]
exclude = ["apps/shell/src-tauri"]

[workspace.package]
version = "0.1.2"
edition = "2021"
rust-version = "1.77.2"
license = "LicenseRef-Fenestra-Open-1.0"
repository = "https://github.com/codecloud-dev/Fenestra"
authors = ["codecloud-dev"]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
